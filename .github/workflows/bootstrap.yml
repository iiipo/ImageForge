name: Build ImageForge APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Find archive
        run: |
          echo "Files in repository:"
          ls -la

          if [ -f ImageForge-Direct-APIKey.zip ]; then
            echo "Found ImageForge-Direct-APIKey.zip"
          elif [ -f ImageForge-GitHub-fixed.zip ]; then
            echo "Found ImageForge-GitHub-fixed.zip"
          else
            echo "Archive not found"
            exit 1
          fi


      - name: Unpack project
        run: |
          if [ -f ImageForge-Direct-APIKey.zip ]; then
            unzip -o ImageForge-Direct-APIKey.zip
          else
            unzip -o ImageForge-GitHub-fixed.zip
          fi

          echo "Project files:"
          find . -maxdepth 3 -type f | sort | head -100


      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"


      - name: Find Android project
        id: project
        run: |
          echo "Searching project..."

          SETTINGS=$(find . \
          \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
          | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found"
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")

          echo "Project root:"
          echo "$DIR"

          echo "path=$DIR" >> $GITHUB_OUTPUT


      - name: Build APK
        run: |
          cd "${{ steps.project.outputs.path }}"

          echo "Building from:"
          pwd

          gradle assembleDebug --stacktrace


      - name: Find APK
        run: |
          echo "Searching APK:"
          find . -name "*.apk"


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImageForge-Direct-APIKey-apk
          path: "**/app-debug.apk"
          if-no-files-found: error
