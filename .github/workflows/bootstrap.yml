name: Build ImageForge APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          unzip -o ImageForge-GitHub.zip
          ls -la

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Find gradlew
        run: |
          find . -name gradlew -type f

      - name: Build APK
        run: |
          chmod +x $(find . -name gradlew -type f | head -1)
          $(find . -name gradlew -type f | head -1) assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImageForge-debug-apk
          path: "**/app-debug.apk"
