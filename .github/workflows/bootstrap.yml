name: Build ImageForge APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Unpack project
        run: |
          echo "=== ROOT BEFORE ==="
          ls -la

          if [ -f ImageForge-GitHub-fixed.zip ]; then
            unzip -o ImageForge-GitHub-fixed.zip
          elif [ -f ImageForge-GitHub.zip ]; then
            unzip -o ImageForge-GitHub.zip
          else
            echo "Archive not found"
            exit 1
          fi

          echo "=== PROJECT FILES ==="
          find . -maxdepth 3 -type f | sort | head -100


      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      - name: Find project
        id: project
        run: |
          echo "Searching Android project..."

          DIR=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -1 | xargs dirname)

          if [ -z "$DIR" ]; then
            echo "settings.gradle not found"
            exit 1
          fi

          echo "Project root: $DIR"
          echo "path=$DIR" >> $GITHUB_OUTPUT


      - name: Build APK
        run: |
          cd "${{ steps.project.outputs.path }}"

          echo "Building from:"
          pwd

          gradle assembleDebug


      - name: Find APK
        run: |
          echo "Searching APK..."
          find . -name "*.apk"


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImageForge-debug-apk
          path: "**/app-debug.apk"
          if-no-files-found: error
