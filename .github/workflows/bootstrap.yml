name: Build ImageForge APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Unpack project
        run: |
          unzip -o ImageForge-Direct-APIKey-fixed-v2.zip
          find . -maxdepth 3 -type f | head -50


      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1


      - name: Find Android project
        run: |
          echo "Searching project..."
          find . -name settings.gradle -o -name settings.gradle.kts


      - name: Build APK
        run: |
          PROJECT=$(dirname $(find . -name settings.gradle -o -name settings.gradle.kts | head -1))
          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew assembleDebug


      - name: Find APK
        run: |
          find . -name "*.apk"


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImageForge-debug-apk
          path: "**/*.apk"
