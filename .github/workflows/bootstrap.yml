name: Build ImageForge APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write


jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Unpack project
        run: |
          echo "=== ROOT ==="
          ls -la

          if [ -f ImageForge-GitHub-fixed.zip ]; then
            unzip -o ImageForge-GitHub-fixed.zip
          elif [ -f ImageForge-GitHub.zip ]; then
            unzip -o ImageForge-GitHub.zip
          else
            echo "Archive not found"
            exit 1
          fi

          echo "=== PROJECT TREE ==="
          find . -maxdepth 3 -type f | sort | head -100


      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"


      - name: Find Android project
        id: project
        run: |
          echo "Searching settings.gradle..."

          PROJECT=$(find . \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)

          if [ -z "$PROJECT" ]; then
            echo "settings.gradle not found"
            exit 1
          fi

          DIR=$(dirname "$PROJECT")

          echo "Found project:"
          echo "$DIR"

          echo "path=$DIR" >> $GITHUB_OUTPUT


      - name: Build APK
        run: |
          cd "${{ steps.project.outputs.path }}"

          echo "Current directory:"
          pwd

          echo "Files:"
          ls -la

          gradle assembleDebug --stacktrace


      - name: Find APK
        run: |
          echo "Searching APK..."
          find . -name "*.apk"


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImageForge-debug-apk
          path: "**/app-debug.apk"
          if-no-files-found: error
