name: Build ImageForge APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: List repository
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== FILES ==="
          find . -maxdepth 3 -type f | head -100


      - name: Unpack project
        run: |
          if [ -f ImageForge-GitHub.zip ]; then
            echo "ZIP found"
            unzip -o ImageForge-GitHub.zip
          else
            echo "ZIP not found"
          fi

          echo "=== AFTER UNPACK ==="
          find . -maxdepth 3 -type f | head -100


      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      - name: Find gradlew
        id: gradle
        run: |
          echo "Searching gradlew..."

          GRADLEW=$(find . -name gradlew -type f | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found"
            exit 1
          fi

          echo "Found: $GRADLEW"
          echo "path=$GRADLEW" >> $GITHUB_OUTPUT


      - name: Build APK
        run: |
          GRADLEW="${{ steps.gradle.outputs.path }}"

          chmod +x "$GRADLEW"

          DIR=$(dirname "$GRADLEW")

          cd "$DIR"

          ./gradlew assembleDebug


      - name: Find APK
        run: |
          echo "Searching APK..."
          find . -name "*.apk"


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImageForge-debug-apk
          path: "**/app-debug.apk"
          if-no-files-found: error
